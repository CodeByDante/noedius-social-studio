name: Actualizar canales y publicar

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay scheduled runs. This is not a live scraping service.
    - cron: '17 * * * *'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: noedius-pages
  cancel-in-progress: false

jobs:
  collect:
    name: Consultar publicaciones públicas
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar extractor de metadatos
        run: python -m pip install -r requirements.txt
      - name: Verificar colector
        run: python -m unittest discover -s tests -p 'test_collector.py' -v
      - name: Verificar formato y selección del último video
        run: node --test tests/frontend.test.mjs
      - name: Consultar los cuatro canales
        timeout-minutes: 4
        env:
          # Optional; RSS is used when this repository secret is absent.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: python scripts/collect.py --config channels.json --output data/latest.json
      - name: Guardar resultados verificados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar metadatos públicos de los canales'
            git push
          fi
      - name: Preparar solo archivos públicos
        run: python scripts/stage_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar en GitHub Pages
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
