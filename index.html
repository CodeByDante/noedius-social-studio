<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090909">
  <meta name="description" content="El último video de Noedius y sus redes, en un mensaje listo para copiar.">
  <title>Noedius · Último video</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=2">
  <script src="app.js?v=2" type="module"></script>
</head>
<body>
  <main class="studio">
    <header><a class="brand" href="./" aria-label="Noedius, inicio">n<span>.</span></a><span class="wordmark">NOEDIUS<span>YOUTUBE · FACEBOOK · TIKTOK · INSTAGRAM</span></span><span class="live-dot" aria-hidden="true"></span></header>
    <section class="content" aria-labelledby="title">
      <p class="eyebrow">TODAS TUS REDES. UN MENSAJE.</p>
      <h1 id="title">Tu último video.</h1>
      <p class="status" id="status" role="status" aria-live="polite">Cargando última consulta…</p>
      <div class="actions">
        <button class="primary" id="refresh" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.5-1L20 9M4 15l2.4 3A7 7 0 0 0 18 17"/></svg><span id="refresh-label">Actualizar</span></button>
        <button class="secondary" id="latest-video" type="button" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 11 7-11 7V5Z"/></svg>Último video<span aria-hidden="true">↗</span></button>
      </div>
      <div class="message-card" id="copy-card" role="button" tabindex="-1" aria-label="Copiar publicación" aria-disabled="true" aria-describedby="copy-hint">
        <div class="card-heading"><span>MENSAJE LISTO PARA COMPARTIR</span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h4"/></svg></div>
        <div id="message" class="message"><p class="empty">Tu publicación aparecerá aquí.</p></div>
        <p id="copy-hint" class="copy-hint">Clic en el mensaje para copiar.</p>
      </div>
      <div id="platform-status" class="platform-status" aria-label="Estado de los canales"></div>
      <p id="notice" class="notice"></p>
    </section>
    <footer><span>Consulta automática cada hora.</span><span>Actualizar busca en el momento.</span></footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Activa JavaScript para consultar y copiar la publicación.</p></noscript>
</body>
</html>
